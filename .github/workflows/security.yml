name: Security Scan CI

on:
  push:
    branches: [ "main" ] # 当你推送到 main 分支时触发
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety flask pyjwt bcrypt flask-sqlalchemy
        
    - name: SAST (Bandit - Static Code Analysis)
      run: bandit -r . -x ./venv
      
    - name: SCA (Safety - Dependency Check)
      run: safety check